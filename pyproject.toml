[project]
name = "catan-ai"
version = "0.0.1"
description = "Research AI for standard four-player base Catan, built on a pinned Catanatron engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["catanatron"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.sources]
# Pinned via the vendor/catanatron git submodule; see docs/architecture-decisions.md (ADR-001).
catanatron = { path = "vendor/catanatron", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catan_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown code blocks are illustrative, not source.
extend-exclude = ["vendor", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["^vendor/"]

[[tool.mypy.overrides]]
# Catanatron ships no type information.
module = ["catanatron", "catanatron.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
